name: ITA Software
description: >-
  ITA Software is a travel technology company, now part of Google, that builds
  airfare pricing, shopping, and availability software for airlines, online
  travel agencies, and travel management companies. Founded in 1996 in Cambridge,
  Massachusetts by MIT computer scientists (notably Jeremy Wertheimer) and backed
  early by Battery Ventures, General Catalyst, and Sequoia Capital, the company
  was acquired by Google in 2011. Its flagship QPX engine powers pricing,
  revenue shopping, ticket rebooking, award-flight search, ancillary
  merchandising, and flight schedule/seat availability for carriers including
  Air Canada, American Airlines, Delta, United, and Virgin Atlantic, and its
  technology underpins Google Flights. ITA Software also operates the consumer
  ITA Matrix flight-search tool at matrix.itasoftware.com. The former public
  QPX Express REST API was retired by Google in April 2018; today ITA Software's
  QPX solutions are delivered as an enterprise engagement through Google account
  teams, with no public self-service developer program, portal, or SDKs.
